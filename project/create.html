<!DOCTYPE html>
<html lang="ru">
    <head>
        <!-- Base -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- CSS -->
        <link rel="stylesheet" href="./CSS/index.css">
        <link rel="stylesheet" href="./CSS/login.css">
        <link rel="stylesheet" href="./CSS/create.css">

        <!-- Font -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

        <title>Janalyq</title>
    </head>

    <body>
        <!-- Header -->
        <header class="header">
            <div class="header__leftside">
                <a href="./index.html" class="header__logo">
                    <h1 class="headerLogo">JANALYQ</h1>
                </a>

                <nav class="header__nav">
                    <ul class="header__nav-list">
                        <li>
                            <a href="./index.html" class="header__nav-link header__nav-link--active" aria-current="page">Новости</a>
                        </li>
                        <li>
                            <a href="./categories.html" class="header__nav-link">Категории</a>
                        </li>
                    </ul>
                </nav>
            </div>

            <div class="header__auth">
                <a href="./login.html" class="button button-blue">Войти</a>
            </div>
        </header>

        <!-- Main -->
        <main>
            <div class="create-window">
                <h1 class="create-window__header">Создание новости</h1>

                <div class="create-window__forms">
                    <div class="create-window__field create-window__title">
                        <p class="create-window__forms-description">Название</p>
                        <input type="text" class="create-window__form title-input" placeholder="Введите название" required>
                    </div>

                    <div class="create-window__field create-window__category">
                        <p class="create-window__forms-description">Категория</p>
                        <select class="create-window__form category-input" placeholder="Введите категорию" required>
                            <option value="">Выберите категорию</option>
                            <option value="technology">Технологии</option>
                            <option value="sports">Спорт</option>
                            <option value="entertainment">Развлечения</option>
                            <option value="urgent">Срочное</option>
                        </select>
                    </div>
                    
                    <div class="create-window__field create-window__thumbnail">
                        <p class="create-window__forms-description">Обложка</p>
                        <input type="file" class="create-window__form thumbnail-input" accept="image/*" required placeholder="Выбрать файл">
                    </div>

                    <div class="create-window__field create-window__content">
                        <p class="create-window__forms-description">Контент</p>
                        <textarea class="create-window__form content-input" placeholder="Введите содержание новости" required></textarea>
                    </div>
                </div>

                <button class="button button-blue create-button">Добавить новость</button>
            </div>
        </main>

    </body>
</html>
